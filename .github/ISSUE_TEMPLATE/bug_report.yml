name: 오류 신고
description: 재현할 수 있는 앱 동작·표시·저장 문제를 알려 주세요.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: |
        실험 원문을 먼저 보관하세요. 계정 정보, 개인 경로, 토큰, 기기 식별자 또는 전체 사용자 프로필을 올리지 마세요.
        실제 장비의 설계·안전 문제를 검증하는 서비스는 제공하지 않습니다.
  - type: input
    id: version
    attributes:
      label: Motor Lab 버전
      description: 프로그램 정보 또는 설치 파일 이름의 버전입니다.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: Windows 버전, GPU 모델, 화면 배율, 설치 앱 또는 개발 브라우저 여부를 적어 주세요. 개인 경로는 필요 없습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 순서
      description: 시작 실험과 전압·부하·관찰 설정, 누른 버튼 순서를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 기대한 결과와 실제 결과
      description: 화면에 표시된 오류 문구나 어긋난 수치·단위를 포함하면 도움이 됩니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 선택 자료
      description: 개인 정보를 지운 최소 실험 JSON이나 스크린샷을 첨부할 수 있습니다. 손상 원본을 덮어쓰지 마세요.
